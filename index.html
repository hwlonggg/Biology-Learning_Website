<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biology 9 | Hoang Long Archive</title>
    <style>
        /* ================= THEME VARIABLES ================= */
        :root {
            /* Light Mode Colors */
            --bg-color: #fcfaf5;
            --header-bg: rgba(255, 255, 255, 0.9);
            --primary-green: #2d5a27;
            --soft-green: #e8f5e9;
            --card-bg: #ffffff;
            --text-dark: #2c3e50;
            --text-light: #5d6d7e;
            --accent-wood: #8d6e63;
            --border: #eeeeee;
        }

        [data-theme="dark"] {
            /* Dark Mode Colors (Deep Forest Style) */
            --bg-color: #0d1a0b;
            --header-bg: rgba(13, 26, 11, 0.95);
            --primary-green: #4caf50;
            --soft-green: #1b2e1a;
            --card-bg: #162615;
            --text-dark: #e8f5e9;
            --text-light: #a5d6a7;
            --accent-wood: #ffab91;
            --border: #2e442d;
        }

        /* ================= GENERAL SETUP ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--soft-green) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-dark);
            font-family: 'Segoe UI', 'Palatino Linotype', serif;
            line-height: 1.6;
        }

        /* ================= HEADER & TOGGLE ================= */
        header {
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 3px solid var(--primary-green);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-green);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Nút gạt chuyển chế độ */
        .theme-switch {
            background: var(--soft-green);
            border: 2px solid var(--primary-green);
            color: var(--primary-green);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .theme-switch:hover {
            opacity: 0.8;
        }

        /* ================= HERO SECTION ================= */
        .hero {
            padding: 60px 5% 30px;
            text-align: center;
        }

        .hero h1 {
            font-size: 3.5rem;
            color: var(--primary-green);
            margin-bottom: 10px;
            font-family: 'Georgia', serif;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: var(--text-light);
            font-style: italic;
        }

        /* ================= SEARCH ================= */
        .search-container {
            max-width: 600px;
            margin: 30px auto;
        }

        .search-box {
            width: 100%;
            padding: 15px 25px;
            border: 2px solid var(--border);
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            background: var(--card-bg);
            color: var(--text-dark);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .search-box:focus {
            border-color: var(--primary-green);
        }

        /* ================= CARDS GRID ================= */
        main {
            padding: 40px 5% 100px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .bio-card {
            text-decoration: none;
            color: inherit;
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .bio-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary-green);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }

        .card-emoji { font-size: 2.5rem; margin-bottom: 15px; }
        .card-title { font-size: 1.2rem; font-weight: 700; color: var(--primary-green); margin-bottom: 10px; }
        .card-desc { font-size: 0.9rem; color: var(--text-light); margin-bottom: 20px; flex-grow: 1; }
        .card-meta { font-size: 0.8rem; font-weight: bold; color: var(--accent-wood); border-top: 1px solid var(--border); padding-top: 15px; }

        /* ================= FOOTER ================= */
        footer {
            text-align: center;
            padding: 60px 20px;
            background: var(--soft-green);
            color: var(--text-light);
            border-top: 1px solid var(--border);
        }

        .author {
            color: var(--primary-green);
            font-weight: 800;
            font-size: 1.1rem;
            margin-top: 8px;
            display: block;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🌿 Biology 9</div>
        <button class="theme-switch" id="theme-toggle">
            <span id="theme-icon">🌙</span> <span id="theme-text">Chế độ tối</span>
        </button>
    </header>

    <section class="hero">
        <h1>Biology 9 📖</h1>
        <p class="hero-subtitle">"Khám phá sự sống qua từng trang sách"</p>
        
        <div class="search-container">
            <input type="text" class="search-box" id="search-input" placeholder="Tìm tên đề thi, tài liệu... 🔍">
        </div>
    </section>

    <main>
        <div class="cards-grid" id="cards-container">
            </div>
    </main>

    <footer>
        <p>Học tập là hành trình khám phá thiên nhiên 🔬</p>
        <span class="author">Created by Nguyễn Hoàng Long🔥</span>
    </footer>

    <script>
        // 1. Data - Thêm emote sách vở theo ý bạn
        const cardData = [
            { emoji: "📝", title: "ĐỀ HỌC SINH GIỎI 8", url: "https://tailieu.vn/...", desc: "Tổng hợp các dạng bài tập bồi dưỡng HSG cấp trường." },
            { emoji: "📂", title: "KHO ĐỀ TỔNG HỢP", url: "https://drive.google.com/...", desc: "Dữ liệu đề thi Sinh học phong phú từ nhiều nguồn." },
            { emoji: "📚", title: "SÁCH PHAN KHẮC NGHỆ", url: "https://drive.google.com/...", desc: "Tài liệu chuyên sâu cho học sinh ôn thi chuyên." },
            { emoji: "📖", title: "SÁCH HUỲNH QUỐC THÀNH", url: "https://www.taisachonthi.com/...", desc: "Hướng dẫn giải chi tiết các chuyên đề Sinh lớp 9." },
            { emoji: "🧬", title: "ĐỀ MINH HOẠ THPT 2026", url: "https://drive.google.com/...", desc: "Cập nhật cấu trúc thi mới nhất của Bộ Giáo dục." },
            { emoji: "📑", title: "MOONBOOK - 60 ĐỀ 2026", url: "https://drive.google.com/...", desc: "Luyện giải đề trắc nghiệm Sinh học 2026." },
            { emoji: "🧪", title: "ÔN CHUYÊN SINH 9-12", url: "https://hoclieuxanh.com/...", desc: "Bộ 21 đề chọn đội tuyển Olympic quốc tế." },
            { emoji: "🏫", title: "ÔN CHUYÊN SINH 10-12", url: "https://www.vnteach.com/...", desc: "Tài liệu nâng cao dành cho khối THPT chuyên." }
        ];

        // 2. Render Cards
        const container = document.getElementById('cards-container');
        cardData.forEach(data => {
            const card = document.createElement('a');
            card.href = data.url;
            card.target = "_blank";
            card.className = "bio-card";
            card.innerHTML = `
                <span class="card-emoji">${data.emoji}</span>
                <div class="card-title">${data.title}</div>
                <div class="card-desc">${data.desc}</div>
                <div class="card-meta">Mở sách học ngay ➜</div>
            `;
            container.appendChild(card);
        });

        // 3. Theme Toggle Logic
        const toggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        const currentTheme = localStorage.getItem('theme');

        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeIcon.innerText = '☀️';
            themeText.innerText = 'Chế độ sáng';
        }

        toggleBtn.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                themeIcon.innerText = '🌙';
                themeText.innerText = 'Chế độ tối';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.innerText = '☀️';
                themeText.innerText = 'Chế độ sáng';
            }
        });

        // 4. Search Logic
        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.bio-card').forEach(card => {
                card.style.display = card.textContent.toLowerCase().includes(term) ? 'flex' : 'none';
            });
        });
    </script>
</body>
</html>
