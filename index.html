<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biology 9 | Hoang Long Archive</title>
    <style>
        /* ================= VARIABLES & RESET ================= */
        :root {
            --bg-color: #fcfaf5; /* Màu giấy kem nhạt */
            --primary-green: #2d5a27; /* Xanh lá đậm học thuật */
            --soft-green: #e8f5e9;
            --accent-wood: #8d6e63;
            --text-dark: #2c3e50;
            --text-light: #5d6d7e;
            --font-main: 'Segoe UI', 'Palatino Linotype', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            /* NỀN TĨNH: Họa tiết giấy nhẹ nhàng */
            background-image: 
                radial-gradient(var(--soft-green) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-dark);
            font-family: var(--font-main);
            line-height: 1.6;
        }

        /* ================= HEADER ================= */
        header {
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 3px solid var(--primary-green);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-green);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ================= HERO SECTION ================= */
        .hero {
            padding: 80px 5% 40px;
            text-align: center;
            background: linear-gradient(to bottom, #f1f8e9, var(--bg-color));
        }

        .hero h1 {
            font-size: 3.5rem;
            color: var(--primary-green);
            margin-bottom: 10px;
            font-family: 'Georgia', serif;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: var(--text-light);
            font-style: italic;
        }

        /* ================= SEARCH ================= */
        .search-container {
            max-width: 600px;
            margin: 30px auto;
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 15px 25px;
            border: 2px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .search-box:focus {
            border-color: var(--primary-green);
            box-shadow: 0 4px 20px rgba(45, 90, 39, 0.15);
        }

        /* ================= MAIN GRID ================= */
        main {
            padding: 40px 5% 100px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* ================= CARD DESIGN ================= */
        .bio-card {
            text-decoration: none;
            color: inherit;
            background: white;
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #eee;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
        }

        .bio-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary-green);
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }

        .card-emoji {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: block;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-green);
            margin-bottom: 10px;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card-meta {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--accent-wood);
            text-transform: uppercase;
            border-top: 1px solid #f0f0f0;
            padding-top: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* ================= FOOTER ================= */
        footer {
            text-align: center;
            padding: 60px 20px;
            background: #f1f3f4;
            color: var(--text-light);
            border-top: 1px solid #e0e0e0;
        }

        .author {
            color: var(--primary-green);
            font-weight: 800;
            font-size: 1.1rem;
            margin-top: 8px;
            display: block;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🌿 Biology 9</div>
        <div style="font-size: 0.9rem; color: var(--text-light);">Thư viện học liệu điện tử</div>
    </header>

    <section class="hero">
        <h1>Biology 9 📖</h1>
        <p class="hero-subtitle">"Khám phá thế giới qua lăng kính khoa học sự sống"</p>
        
        <div class="search-container">
            <input type="text" class="search-box" id="search-input" placeholder="Tìm tên đề thi, sách, tài liệu... 🔍">
        </div>
    </section>

    <main>
        <div class="cards-grid" id="cards-container">
            </div>
    </main>

    <footer>
        <p>Học tập là một hành trình không ngừng nghỉ 🔬</p>
        <span class="author">Created by Nguyễn Hoàng Long🔥</span>
    </footer>

    <script>
        const cardData = [
            { emoji: "📝", title: "ĐỀ HỌC SINH GIỎI 8", url: "https://tailieu.vn/...", desc: "Tổng hợp các dạng bài tập bồi dưỡng HSG cấp trường." },
            { emoji: "📂", title: "KHO ĐỀ TỔNG HỢP", url: "https://drive.google.com/...", desc: "Dữ liệu đề thi Sinh học phong phú từ nhiều nguồn." },
            { emoji: "📚", title: "SÁCH PHAN KHẮC NGHỆ", url: "https://drive.google.com/...", desc: "Tài liệu chuyên sâu cho học sinh ôn thi chuyên." },
            { emoji: "📖", title: "SÁCH HUỲNH QUỐC THÀNH", url: "https://www.taisachonthi.com/...", desc: "Hướng dẫn giải chi tiết các chuyên đề Sinh lớp 9." },
            { emoji: "🧬", title: "ĐỀ MINH HOẠ THPT 2026", url: "https://drive.google.com/...", desc: "Cập nhật cấu trúc thi mới nhất của Bộ Giáo dục." },
            { emoji: "📑", title: "MOONBOOK - 60 ĐỀ 2026", url: "https://drive.google.com/...", desc: "Luyện giải đề trắc nghiệm Sinh học 2026." },
            { emoji: "🧪", title: "ÔN CHUYÊN SINH 9-12", url: "https://hoclieuxanh.com/...", desc: "Bộ 21 đề chọn đội tuyển Olympic quốc tế." },
            { emoji: "🏫", title: "ÔN CHUYÊN SINH 10-12", url: "https://www.vnteach.com/...", desc: "Tài liệu nâng cao dành cho khối THPT chuyên." }
        ];

        const container = document.getElementById('cards-container');

        cardData.forEach(data => {
            const card = document.createElement('a');
            card.href = data.url;
            card.target = "_blank";
            card.className = "bio-card";
            card.innerHTML = `
                <span class="card-emoji">${data.emoji}</span>
                <div class="card-title">${data.title}</div>
                <div class="card-desc">${data.desc}</div>
                <div class="card-meta">Đọc tài liệu ➜</div>
            `;
            container.appendChild(card);
        });

        // Search logic đơn giản
        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.bio-card').forEach(card => {
                card.style.display = card.textContent.toLowerCase().includes(term) ? 'flex' : 'none';
            });
        });
    </script>
</body>
</html>
