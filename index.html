<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioX Portal | Static Premium Edition</title>
    <style>
        /* ================= VARIABLES & RESET ================= */
        :root {
            --bg-color: #020205;
            --primary: #00f3ff;
            --secondary: #00ff66;
            --accent: #ff00ff;
            --glass-bg: rgba(10, 15, 30, 0.6);
            --glass-border: rgba(0, 243, 255, 0.2);
            --text-main: #e0f7fa;
            --text-dim: #8ab4f8;
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        body {
            background-color: var(--bg-color);
            /* NỀN TĨNH: Kết hợp Radial Gradient và lưới Cyber Grid mờ */
            background-image: 
                radial-gradient(circle at 50% 50%, #0a0a2a 0%, #020205 100%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ================= CUSTOM CURSOR ================= */
        .cursor-dot, .cursor-outline {
            position: fixed;
            top: 0; left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
        }
        .cursor-dot {
            width: 8px; height: 8px;
            background-color: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }
        .cursor-outline {
            width: 40px; height: 40px;
            border: 1px solid rgba(0, 243, 255, 0.5);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }

        /* ================= HEADER ================= */
        header {
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(2, 2, 5, 0.8);
            position: fixed;
            width: 100%;
            z-index: 100;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ================= HERO SECTION ================= */
        .hero {
            padding: 160px 5% 60px;
            text-align: center;
            position: relative;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(to bottom, #fff, var(--text-dim));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .typing-text {
            font-size: 1.2rem;
            color: var(--primary);
            min-height: 30px;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        /* ================= MAIN GRID ================= */
        main {
            padding: 0 5% 100px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            display: block;
            margin: 0 auto 60px;
            padding: 15px 30px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0,243,255,0.1);
            background: rgba(255,255,255,0.05);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        /* ================= CARD DESIGN ================= */
        .cyber-card {
            text-decoration: none;
            perspective: 1000px;
        }

        .card-inner {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 0.1s ease, border-color 0.3s;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        .card-inner::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(0,243,255,0.1) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .cyber-card:hover .card-inner {
            border-color: var(--primary);
        }
        .cyber-card:hover .card-inner::after { opacity: 1; }

        .card-icon {
            width: 45px; height: 45px;
            margin-bottom: 20px;
            fill: var(--primary);
            filter: drop-shadow(0 0 8px var(--primary));
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #fff;
            line-height: 1.4;
            transform: translateZ(20px);
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .card-btn {
            padding: 10px;
            border: 1px solid var(--secondary);
            color: var(--secondary);
            border-radius: 6px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .cyber-card:hover .card-btn {
            background: var(--secondary);
            color: #000;
        }

        footer {
            text-align: center;
            padding: 60px;
            color: var(--text-dim);
            font-size: 0.8rem;
            border-top: 1px solid var(--glass-border);
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <svg style="display:none;">
        <symbol id="icon-book" viewBox="0 0 24 24">
            <path d="M12 21l-8-4.5v-9l8 4.5 8-4.5v9l-8 4.5zm0-10.5l-8-4.5 8-4.5 8 4.5-8 4.5z"/>
        </symbol>
    </svg>

    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-outline" id="cursor-outline"></div>

    <header>
        <div class="logo">BioX Portal</div>
        <div style="color: var(--text-dim); font-size: 0.8rem;">STATIC ENGINE // 8A5 EDITION</div>
    </header>

    <section class="hero">
        <h1>Trung Tâm Học Liệu</h1>
        <div class="typing-text" id="typing-text"></div>
    </section>

    <main>
        <input type="text" class="search-box" id="search-input" placeholder="Tìm kiếm tài liệu học tập...">
        <div class="cards-grid" id="cards-container"></div>
    </main>

    <footer>
        &copy; 2026 BioX Portal. Designed for High-Performance Learning.
    </footer>

    <script>
        /* ================= CURSOR LOGIC ================= */
        const dot = document.getElementById('cursor-dot');
        const outline = document.getElementById('cursor-outline');

        window.addEventListener('mousemove', (e) => {
            dot.style.left = e.clientX + 'px';
            dot.style.top = e.clientY + 'px';
            setTimeout(() => {
                outline.style.left = e.clientX + 'px';
                outline.style.top = e.clientY + 'px';
            }, 40);
        });

        /* ================= DATA ================= */
        const cardData = [
            { title: "ĐỀ HỌC SINH GIỎI 8", url: "https://tailieu.vn/tim-kiem/?q=B%E1%BB%99+%C4%91%E1%BB%81+thi+h%E1%BB%8Dc+sinh+gi%E1%BB%8Fi+m%C3%B4n+Sinh+h%E1%BB%8Dc+l%E1%BB%9Bp+8+c%E1%BA%A5p+tr%C6%B0%E1%BB%9Dng", desc: "Tài liệu bồi dưỡng HSG cấp trường lớp 8." },
            { title: "KHO ĐỀ HSG TỔNG HỢP", url: "https://drive.google.com/drive/folders/15Gy1Y_pQJ8HvFy1hav_3i7Hgt83UQO8p", desc: "Thư mục Drive chứa hàng trăm đề thi chọn lọc." },
            { title: "PHAN KHẮC NGHỆ - SINH 9", url: "https://drive.google.com/file/d/1RWoCL2xCi9dRmgN5in7epVficZwP_VRG/view?pli=1", desc: "Sách bồi dưỡng chuyên sâu cho lớp 9." },
            { title: "HUỲNH QUỐC THÀNH - SINH 9", url: "https://www.taisachonthi.com/2021/11/pdf-boi-duong-hoc-sinh-gioi-sinh-hoc-9.html?utm_source=chatgpt.com", desc: "Cẩm nang ôn thi vào các trường chuyên." },
            { title: "ĐỀ MINH HOẠ THPT 2026 V1", url: "https://drive.google.com/drive/folders/1DHCFvCF_DyE5XUyBX7PZ16QavZuYODv0?hl=vi&safe=active", desc: "Cập nhật cấu trúc đề thi mới nhất hệ THPT." },
            { title: "MOONBOOK - 60 ĐỀ 2026", url: "https://drive.google.com/file/d/1tPVc8_lE1CphW8N91PoAumzV-jmUb7KM/view", desc: "Tài liệu ôn thi trắc nghiệm Sinh học Moonbook." },
            { title: "ĐỀ MINH HOẠ THPT 2026 V2", url: "https://drive.google.com/drive/folders/1hYDCL3ldC0aKoziPcNEVcuiH04n6y75D?hl=vi&safe=active", desc: "Phiên bản cập nhật lần 2 đề mẫu THPT." },
            { title: "THREADS HẠ MINI", url: "https://www.threads.com/@ha_mini19", desc: "Kênh chia sẻ tài liệu và kinh nghiệm ôn thi." },
            { title: "ÔN CHUYÊN SINH 9-12", url: "https://hoclieuxanh.com/posts/bo-21-de-chon-doi-tuyen-olympic-sinh-hoc-quoc-te-tu-2003-den-2021-pdf?utm_source=chatgpt.com", desc: "Hệ thống bài tập Olympic quốc tế." },
            { title: "24 ĐỀ THI THỬ 2025 V1", url: "https://www.threads.com/@ha_mini19/post/DWRTcLEj3cP", desc: "Tuyển chọn đề thi thử các sở giáo dục." },
            { title: "24 ĐỀ THI THỬ 2025 V2", url: "https://www.threads.com/@ha_mini19/post/DWQFdbrjwqm", desc: "Bổ sung các dạng bài tập mới cho năm 2025." },
            { title: "TỔNG HỢP 65 ĐỀ SINH", url: "https://drive.google.com/drive/folders/1dFq7YwsV2Ukb-v0GHfGl-9LYKTitMUmA", desc: "Bộ đề luyện giải đề thi tốt nghiệp và đại học." },
            { title: "ÔN CHUYÊN SINH 10-12", url: "https://www.vnteach.com/tai-lieu-hsg-sinh-hoc-10?utm_source=chatgpt.com", desc: "Tài liệu dành cho khối THPT nâng cao." }
        ];

        /* ================= RENDER CARDS ================= */
        const container = document.getElementById('cards-container');

        cardData.forEach(data => {
            const link = document.createElement('a');
            link.href = data.url;
            link.target = "_blank";
            link.className = "cyber-card";
            link.innerHTML = `
                <div class="card-inner">
                    <svg class="card-icon"><use href="#icon-book"></use></svg>
                    <div class="card-title">${data.title}</div>
                    <div class="card-desc">${data.desc}</div>
                    <div class="card-btn">Mở tài liệu</div>
                </div>
            `;

            // 3D Tilt Effect
            link.addEventListener('mousemove', (e) => {
                const inner = link.querySelector('.card-inner');
                const rect = link.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                inner.style.setProperty('--x', (x / rect.width) * 100 + '%');
                inner.style.setProperty('--y', (y / rect.height) * 100 + '%');
                inner.style.transform = `perspective(1000px) rotateX(${(centerY - y) / 15}deg) rotateY(${(x - centerX) / 15}deg)`;
            });

            link.addEventListener('mouseleave', () => {
                link.querySelector('.card-inner').style.transform = `rotateX(0) rotateY(0)`;
            });

            container.appendChild(link);
        });

        /* ================= SEARCH LOGIC ================= */
        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.cyber-card').forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(term) ? 'block' : 'none';
            });
        });

        /* ================= SIMPLE TYPING ================= */
        const msg = "Hệ thống lưu trữ dữ liệu học tập môn Sinh học - Offline Ready.";
        let i = 0;
        function type() {
            if (i < msg.length) {
                document.getElementById('typing-text').innerHTML += msg.charAt(i);
                i++;
                setTimeout(type, 50);
            }
        }
        type();
    </script>
</body>
</html>
