<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biology 9 | Hoang Long Edition</title>
    <style>
        /* ================= VARIABLES & RESET ================= */
        :root {
            --bg-color: #020205;
            --primary: #00f3ff;
            --secondary: #00ff66;
            --glass-bg: rgba(10, 15, 30, 0.7);
            --glass-border: rgba(0, 243, 255, 0.2);
            --text-main: #e0f7fa;
            --text-dim: #8ab4f8;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* Custom cursor */
        }

        body {
            background-color: var(--bg-color);
            /* NỀN TĨNH: Radial Gradient & Cyber Grid */
            background-image: 
                radial-gradient(circle at 50% 50%, #0a0a2a 0%, #020205 100%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 45px 45px, 45px 45px;
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ================= CUSTOM CURSOR ================= */
        .cursor-dot, .cursor-outline {
            position: fixed;
            top: 0; left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
        }
        .cursor-dot {
            width: 8px; height: 8px;
            background-color: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }
        .cursor-outline {
            width: 40px; height: 40px;
            border: 1px solid rgba(0, 243, 255, 0.5);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }

        /* ================= HEADER ================= */
        header {
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(2, 2, 5, 0.85);
            position: fixed;
            width: 100%;
            z-index: 100;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        /* ================= HERO SECTION ================= */
        .hero {
            padding: 160px 5% 40px;
            text-align: center;
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 6px;
            background: linear-gradient(to bottom, #ffffff 30%, var(--text-dim));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0, 243, 255, 0.2));
        }

        .typing-text {
            font-size: 1.1rem;
            color: var(--secondary);
            opacity: 0.9;
            letter-spacing: 2px;
            min-height: 25px;
        }

        /* ================= MAIN GRID ================= */
        main {
            padding: 40px 5% 100px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .search-box {
            width: 100%;
            max-width: 500px;
            display: block;
            margin: 0 auto 60px;
            padding: 16px 25px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 25px rgba(0,243,255,0.15);
            background: rgba(255,255,255,0.06);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        /* ================= CARD DESIGN ================= */
        .cyber-card {
            text-decoration: none;
            perspective: 1000px;
        }

        .card-inner {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 30px;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 0.15s ease, border-color 0.4s;
            transform-style: preserve-3d;
            position: relative;
            overflow: hidden;
        }

        .card-inner::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(0,243,255,0.12) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .cyber-card:hover .card-inner {
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .cyber-card:hover .card-inner::before { opacity: 1; }

        .card-title {
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: #fff;
            line-height: 1.4;
            transform: translateZ(25px);
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 30px;
            flex-grow: 1;
            transform: translateZ(15px);
        }

        .card-btn {
            padding: 12px;
            border: 1px solid var(--secondary);
            color: var(--secondary);
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            transform: translateZ(10px);
        }

        .cyber-card:hover .card-btn {
            background: var(--secondary);
            color: #020205;
            box-shadow: 0 0 15px var(--secondary);
        }

        /* ================= FOOTER ================= */
        footer {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-dim);
            font-size: 1rem;
            border-top: 1px solid var(--glass-border);
            letter-spacing: 1px;
            background: rgba(0,0,0,0.3);
        }

        .author-name {
            color: #fff;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 10px;
            display: block;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .logo { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-outline" id="cursor-outline"></div>

    <header>
        <div class="logo">BIOLOGY 9</div>
        <div style="color: var(--primary); font-size: 0.8rem; font-weight: bold; letter-spacing: 2px;">RESOURCES HUB</div>
    </header>

    <section class="hero">
        <h1>Biology 9</h1>
        <div class="typing-text" id="typing-text"></div>
    </section>

    <main>
        <input type="text" class="search-box" id="search-input" placeholder="Tìm kiếm học liệu...">
        <div class="cards-grid" id="cards-container"></div>
    </main>

    <footer>
        <p>Hệ thống tài liệu trực tuyến chuyên sâu</p>
        <span class="author-name">Created by Nguyễn Hoàng Long🔥</span>
    </footer>

    <script>
        /* ================= CURSOR LOGIC ================= */
        const dot = document.getElementById('cursor-dot');
        const outline = document.getElementById('cursor-outline');

        window.addEventListener('mousemove', (e) => {
            dot.style.left = e.clientX + 'px';
            dot.style.top = e.clientY + 'px';
            setTimeout(() => {
                outline.style.left = e.clientX + 'px';
                outline.style.top = e.clientY + 'px';
            }, 50);
        });

        /* ================= DATA ================= */
        const cardData = [
            { title: "TÀI LIỆU CÁC ĐỀ HỌC SINH GIỎI 8", url: "https://tailieu.vn/tim-kiem/?q=B%E1%BB%99+%C4%91%E1%BB%81+thi+h%E1%BB%8Dc+sinh+gi%E1%BB%8Fi+m%C3%B4n+Sinh+h%E1%BB%8Dc+l%E1%BB%9Bp+8+c%E1%BA%A5p+tr%C6%B0%E1%BB%9Dng", desc: "Tổng hợp đề thi HSG Sinh học lớp 8 cấp trường." },
            { title: "TÀI LIỆU CÁC ĐỀ HỌC SINH GIỎI", url: "https://drive.google.com/drive/folders/15Gy1Y_pQJ8HvFy1hav_3i7Hgt83UQO8p", desc: "Kho lưu trữ Drive tổng hợp đề thi HSG các cấp." },
            { title: "SÁCH BD HSG SINH 9 - PHAN KHẮC NGHỆ", url: "https://drive.google.com/file/d/1RWoCL2xCi9dRmgN5in7epVficZwP_VRG/view?pli=1", desc: "Giáo trình bồi dưỡng chuyên sâu Sinh học 9." },
            { title: "SÁCH BD HSG SINH 9 - HUỲNH QUỐC THÀNH", url: "https://www.taisachonthi.com/2021/11/pdf-boi-duong-hoc-sinh-gioi-sinh-hoc-9.html?utm_source=chatgpt.com", desc: "Tài liệu bồi dưỡng HSG chuyên Sinh 9." },
            { title: "BỘ ĐỀ MINH HOẠ THPT 2026 (VER1)", url: "https://drive.google.com/drive/folders/1DHCFvCF_DyE5XUyBX7PZ16QavZuYODv0?hl=vi&safe=active", desc: "Cấu trúc đề thi minh họa THPT 2026 lần 1." },
            { title: "SÁCH 60 ĐỀ MINH HOẠ SINH 2026", url: "https://drive.google.com/file/d/1tPVc8_lE1CphW8N91PoAumzV-jmUb7KM/view", desc: "Bộ đề chuẩn từ Moonbook cho kỳ thi 2026." },
            { title: "BỘ ĐỀ MINH HOẠ THPT 2026 (VER2)", url: "https://drive.google.com/drive/folders/1hYDCL3ldC0aKoziPcNEVcuiH04n6y75D?hl=vi&safe=active", desc: "Cấu trúc đề thi minh họa THPT 2026 lần 2." },
            { title: "NGƯỜI DÙNG CHIA SẺ TÀI LIỆU", url: "https://www.threads.com/@ha_mini19", desc: "Kênh chia sẻ tài liệu học tập đa môn học." },
            { title: "ÔN THI CHUYÊN SINH 9-12", url: "https://hoclieuxanh.com/posts/bo-21-de-chon-doi-tuyen-olympic-sinh-hoc-quoc-te-tu-2003-den-2021-pdf?utm_source=chatgpt.com", desc: "Bộ đề chọn đội tuyển Olympic Sinh học quốc tế." },
            { title: "24 ĐỀ THI THỬ SINH 2025 (VER1)", url: "https://www.threads.com/@ha_mini19/post/DWRTcLEj3cP", desc: "Tổng hợp đề thi thử các trường và sở GD 2025." },
            { title: "24 ĐỀ THI THỬ SINH 2025 (VER2)", url: "https://www.threads.com/@ha_mini19/post/DWQFdbrjwqm", desc: "Bổ sung các đề thi thử Sinh học chất lượng." },
            { title: "TỔNG HỢP 65 ĐỀ THI THỬ", url: "https://drive.google.com/drive/folders/1dFq7YwsV2Ukb-v0GHfGl-9LYKTitMUmA", desc: "Tập hợp 65 đề thi thử môn Sinh học chọn lọc." },
            { title: "TÀI LIỆU ÔN CHUYÊN SINH 10-12", url: "https://www.vnteach.com/tai-lieu-hsg-sinh-hoc-10?utm_source=chatgpt.com", desc: "Dữ liệu ôn thi học sinh giỏi lớp 10, 11 và 12." }
        ];

        /* ================= RENDER CARDS ================= */
        const container = document.getElementById('cards-container');

        cardData.forEach(data => {
            const link = document.createElement('a');
            link.href = data.url;
            link.target = "_blank";
            link.className = "cyber-card";
            link.innerHTML = `
                <div class="card-inner">
                    <div class="card-title">${data.title}</div>
                    <div class="card-desc">${data.desc}</div>
                    <div class="card-btn">Truy cập ngay</div>
                </div>
            `;

            // 3D Tilt Effect
            link.addEventListener('mousemove', (e) => {
                const inner = link.querySelector('.card-inner');
                const rect = link.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                inner.style.setProperty('--x', (x / rect.width) * 100 + '%');
                inner.style.setProperty('--y', (y / rect.height) * 100 + '%');
                inner.style.transform = `perspective(1000px) rotateX(${(centerY - y) / 12}deg) rotateY(${(x - centerX) / 12}deg) scale3d(1.02, 1.02, 1.02)`;
            });

            link.addEventListener('mouseleave', () => {
                link.querySelector('.card-inner').style.transform = `rotateX(0) rotateY(0) scale3d(1, 1, 1)`;
            });

            container.appendChild(link);
        });

        /* ================= SEARCH LOGIC ================= */
        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.cyber-card').forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(term) ? 'block' : 'none';
            });
        });

        /* ================= TYPING ANIMATION ================= */
        const msg = "Database initialized... Accessing Biological Resources.";
        let i = 0;
        function typeEffect() {
            if (i < msg.length) {
                document.getElementById('typing-text').innerHTML += msg.charAt(i);
                i++;
                setTimeout(typeEffect, 60);
            }
        }
        setTimeout(typeEffect, 800);
    </script>
</body>
</html>
